<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#060911"/>
  <g stroke="rgba(255,255,255,0.06)" stroke-width="1">
    <line x1="0" y1="125" x2="800" y2="125"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>
  <!-- Flight telemetry arc -->
  <path d="M 120,400 Q 400,80 680,260" fill="none" stroke="#ccff00" stroke-width="2.5" stroke-dasharray="6,6"/>
  <circle cx="680" cy="260" r="8" fill="#ccff00"/>
  <circle cx="680" cy="260" r="16" fill="none" stroke="#ccff00" stroke-width="1.5" opacity="0.6"/>
  <g transform="translate(60, 60)">
    <text x="0" y="30" fill="#ccff00" font-family="monospace" font-size="13" letter-spacing="2">AEROSPACE TELEMETRY</text>
    <text x="0" y="70" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="900">HYPERION DYNAMICS</text>
  </g>
</svg>