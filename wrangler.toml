name = "sindikato-agency"
main = "_worker.js"
compatibility_date = "2026-08-27"
pages_build_output_dir = "."

[assets]
directory = "."
binding = "ASSETS"

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "sindikato_hosts_db"
database_id = "sindikato_hosts_db"
migrations_dir = "migrations"
